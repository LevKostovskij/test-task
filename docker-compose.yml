services:
  app:
    build:
      context: .docker/images/php-fpm/
      dockerfile: Dockerfile
    container_name: tasks-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - tasks-network
  db:
    image: mysql:8.0
    container_name: tasks-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tasks_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tasks-network
  nginx:
    image: nginx:1.25-alpine
    container_name: tasks-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/images/nginx:/etc/nginx/conf.d
    networks:
      - tasks-network
networks:
  tasks-network:
    driver: bridge
volumes:
  mysql_data: